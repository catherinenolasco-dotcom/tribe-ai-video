<style>
  /* Layout: full-height hero over thin orbit lines with a big serif headline, then one muted strip of company logos sliding left to right along the bottom, like the tribe.ai home page. */
  :root {
    --bg: #FAFAF8; --ink: #06141B; --muted: #4F5B60; --line: #D9DCD6;
    --accent: #0A99C3; --dot-1: #65D9EE; --dot-2: #0A99C3; --dot-3: #FF7C0F; --dot-4: #AD5913;
    --logo-filter: grayscale(1); --logo-blend: multiply; --logo-opacity: 0.6;
    --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #06141B; --ink: #EBEBE2; --muted: #9FB0B8; --line: #1F3A46;
      --accent: #65D9EE; --dot-2: #2BB4DC; --dot-4: #E08A3C;
      --logo-filter: grayscale(1) invert(1); --logo-blend: screen; --logo-opacity: 0.7;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #06141B; --ink: #EBEBE2; --muted: #9FB0B8; --line: #1F3A46;
    --accent: #65D9EE; --dot-2: #2BB4DC; --dot-4: #E08A3C;
    --logo-filter: grayscale(1) invert(1); --logo-blend: screen; --logo-opacity: 0.7;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { position: relative; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
  .orbits { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .orbits .ring { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
  .orbits .d1 { fill: var(--dot-1); } .orbits .d2 { fill: var(--dot-2); }
  .orbits .d3 { fill: var(--dot-3); } .orbits .d4 { fill: var(--dot-4); }

  .caption { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; }
  .top { position: relative; padding: 1.5rem 0.25rem 0; display: flex; justify-content: space-between; }
  .top .brand { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 1.125rem; }
  .top .brand span { color: var(--muted); font-weight: 400; }

  .hero { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 0; }
  h1 {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(2.5rem, 7vw, 5.25rem); line-height: 1.06; letter-spacing: -0.015em;
    margin: 0; max-width: 16ch; text-wrap: balance;
  }
  h1 .hl { color: var(--accent); }

  .lower { position: relative; padding-bottom: 2rem; display: flex; flex-direction: column; gap: 1.75rem; }
  .lower .caption { text-align: center; }

  /* Logo strip: slides to the left in a loop. Without JS or with reduced motion it wraps and centers. */
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem 0; }
  .grid.live {
    flex-wrap: nowrap; justify-content: flex-start; overflow: hidden; gap: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .track { display: flex; width: max-content; animation: slide 50s linear infinite; }
  .grid.live:hover .track { animation-play-state: paused; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
  .co { flex: 0 0 auto; width: 12rem; height: 4.5rem; display: flex; align-items: center; justify-content: center; }
  .co img {
    height: var(--h, 3rem); width: auto; max-width: 9.5rem; object-fit: contain;
    filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); opacity: var(--logo-opacity);
  }
  .co .nm { font-family: var(--font-display); font-size: 1.375rem; letter-spacing: 0.02em; color: var(--muted); text-align: center; line-height: 1.1; text-wrap: balance; max-width: 9.5rem; }
  .fine { margin: 0; text-align: center; color: var(--muted); font-size: 0.75rem; }

  @media (max-width: 480px) { .co { width: 9.5rem; } .co img { max-width: 7.5rem; } }
</style>

<script>
  // Wrap the logos in a track and duplicate them once so the slide loops with no jump.
  (function () {
    var grid = document.querySelector('.grid');
    if (!grid || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var track = document.createElement('div');
    track.className = 'track';
    while (grid.firstChild) track.appendChild(grid.firstChild);
    Array.prototype.slice.call(track.children).forEach(function (el) {
      var c = el.cloneNode(true);
      c.setAttribute('aria-hidden', 'true');
      track.appendChild(c);
    });
    grid.appendChild(track);
    grid.classList.add('live');
  })();
</script>
